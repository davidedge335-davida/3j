<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五个领域 · 三维沙盘</title>
<!--
  最简演示页：只有一张全屏画布 + 五个切换按钮，方便单独看沙盘本身。
  打开方式：在本文件夹运行  python3 -m http.server 8000  然后访问 http://localhost:8000/
  （浏览器不允许双击直接打开 ES 模块，所以要用本地服务器）
  官网里的用法一样：滚动到哪个领域，就调用 sol.goTo(i)。
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #e8e4dc; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  header { position: fixed; left: 24px; top: 20px; pointer-events: none; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .04em; }
  header p { margin: 4px 0 0; color: #8d887f; font-size: 12px; }
  nav { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 32px); }
  nav button { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid #2c2a27; border-radius: 999px; background: rgba(20, 19, 18, .78); color: #cfc9bf; font: inherit; cursor: pointer; backdrop-filter: blur(6px); transition: border-color .2s, color .2s; }
  nav button:hover { border-color: #57524b; color: #fff; }
  nav button[aria-pressed="true"] { border-color: var(--c); color: #fff; }
  nav i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: #8d887f; }
</style>
</head>
<body>
<canvas id="sol"></canvas>
<header><h1>五个领域 · 三维沙盘</h1><p>点按钮或按 ← → 切换；鼠标移动镜头会轻微跟随</p></header>
<nav id="nav"></nav>
<div id="err">这台设备的浏览器不支持 WebGL2，看不到三维沙盘。</div>
<script type="module">
  import * as THREE from './vendor/three.module.min.js';
  import { create } from './sol3d.js';

  // 领域名和按钮上的色点（和 sol3d.js 里 DOMAINS 的 accent 对应，这里是网页颜色）
  const LIST = [['智慧城市', '#ff6a1a'], ['智慧政务', '#3a6cff'], ['教育医疗', '#22d96c'], ['金融保险', '#ff8040'], ['能源智造', '#ffdcaa']];
  const canvas = document.getElementById('sol'), nav = document.getElementById('nav');

  if (!document.createElement('canvas').getContext('webgl2')) {
    document.getElementById('err').style.display = 'grid';
  } else {
    const sol = await create(canvas, THREE, { start: 0 });
    window.__sol = sol;                       // 方便在浏览器控制台里试：__sol.goTo(3)、__sol._hold(1.5)
    let cur = 0;
    const btns = LIST.map(([name, color], i) => {
      const b = document.createElement('button');
      b.style.setProperty('--c', color);
      b.innerHTML = `<i></i>${name}`;
      b.onclick = () => go(i);
      nav.appendChild(b);
      return b;
    });
    const go = i => { cur = (i + LIST.length) % LIST.length; sol.goTo(cur); btns.forEach((b, k) => b.setAttribute('aria-pressed', k === cur)); };
    addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
    go(0);
  }
</script>
</body>
</html>
